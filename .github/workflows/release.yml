name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize releases so two pushes to main can't race for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push over SSH as the release-workflow deploy key: deploy keys are
          # bypass actors on the main ruleset, GITHUB_TOKEN is not.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Fail fast before mutating anything (version bump / commit) if the
      # release artifacts are missing.
      - name: Verify binaries present
        run: |
          for name in clover-hook-darwin-arm64 clover-hook-darwin-amd64 clover-hook-linux-amd64 clover-hook-linux-arm64 clover-hook-windows-amd64.exe clover-hook-windows-arm64.exe; do
            if [ ! -f "binaries/$name" ]; then
              echo "ERROR: binaries/$name is missing — push binaries from the source repo before releasing" >&2
              exit 1
            fi
          done

      # Each plugin is versioned and released independently:
      #
      #   clover                    — the main plugin, kept in lockstep across
      #                               all four Claude + Cursor manifests,
      #                               released under the legacy "v<version>"
      #                               tag with the hook binaries attached.
      #   clover-for-security-teams — the "ask Clover" plugin (formerly
      #                               clover-appsec), versioned on its own in
      #                               its own manifest + the marketplace entry,
      #                               released under
      #                               "clover-for-security-teams-v<version>"
      #                               (skills-only, no binaries).
      #   clover-for-developers     — the developer-facing "ask Clover" plugin,
      #                               versioned on its own in its own manifest +
      #                               the marketplace entry, released under
      #                               "clover-for-developers-v<version>"
      #                               (skills-only, no binaries).
      #
      # For each plugin: if its current-version tag already exists, patch-bump
      # and commit; then tag + cut a release for the resolved version. Matches
      # the existing bump-on-push behaviour (the bump commit carries [skip ci]
      # so it does not trigger a second, racing Release run).
      - name: Release each plugin independently
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag_exists() { git tag -l "$1" | grep -qxF "$1"; }

          # Patch-bump, skipping any version whose tag already exists so a stale
          # tag left by an earlier run can't wedge the release.
          next_free_patch() {
            local prefix=$1 major minor patch
            IFS='.' read -r major minor patch <<< "$2"
            while :; do
              patch=$((patch + 1))
              tag_exists "${prefix}${major}.${minor}.${patch}" || break
            done
            echo "${major}.${minor}.${patch}"
          }

          # True when any of the given paths differ between <ref> and HEAD.
          changed_since() {
            local ref=$1
            shift
            ! git diff --quiet "$ref" HEAD -- "$@"
          }

          BUMPED=false

          # Release a plugin ONLY when its own content changed since its last
          # release tag, so a push touching one plugin (or just docs/CI) never
          # bumps or re-releases another. Per plugin:
          #   tag missing            -> version bumped manually / first release; cut as-is.
          #   tag present + changed  -> patch-bump, commit [skip ci], tag + release.
          #   tag present + no change -> skip.

          # ---- clover (main) -------------------------------------------------
          # Everything clover ships across Claude + Cursor. The shared
          # .claude-plugin/marketplace.json is excluded so an edit to another
          # plugin's entry there can't trigger a clover release; clover's own
          # entry is kept in lockstep by the bump below.
          CLOVER_PATHS=(claude cursor binaries .claude-plugin/plugin.json .cursor-plugin)
          CLOVER_V=$(jq -r '.version' .claude-plugin/plugin.json)
          CLOVER_RELEASE=false
          if ! tag_exists "v$CLOVER_V"; then
            CLOVER_RELEASE=true
          elif changed_since "v$CLOVER_V" "${CLOVER_PATHS[@]}"; then
            CLOVER_V=$(next_free_patch "v" "$CLOVER_V")
            # The version field lives at a different JSON path in each manifest;
            # keep all four in lockstep (validate.yml enforces this).
            jq --arg v "$CLOVER_V" '.version = $v'            .claude-plugin/plugin.json      > tmp.json && mv tmp.json .claude-plugin/plugin.json
            jq --arg v "$CLOVER_V" '.plugins[0].version = $v' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
            jq --arg v "$CLOVER_V" '.version = $v'            .cursor-plugin/plugin.json      > tmp.json && mv tmp.json .cursor-plugin/plugin.json
            jq --arg v "$CLOVER_V" '.metadata.version = $v'   .cursor-plugin/marketplace.json > tmp.json && mv tmp.json .cursor-plugin/marketplace.json
            git add .claude-plugin/plugin.json .claude-plugin/marketplace.json .cursor-plugin/plugin.json .cursor-plugin/marketplace.json
            git commit -m "chore(clover): bump version to $CLOVER_V [skip ci]"
            BUMPED=true
            CLOVER_RELEASE=true
          else
            echo "clover: no content changes since v$CLOVER_V — skipping."
          fi
          CLOVER_TAG="v$CLOVER_V"

          # ---- clover-for-security-teams (ask Clover) ------------------------
          APPSEC_PATHS=(clover-for-security-teams)
          APPSEC_V=$(jq -r '.version' clover-for-security-teams/.claude-plugin/plugin.json)
          APPSEC_RELEASE=false
          if ! tag_exists "clover-for-security-teams-v$APPSEC_V"; then
            APPSEC_RELEASE=true
          elif changed_since "clover-for-security-teams-v$APPSEC_V" "${APPSEC_PATHS[@]}"; then
            APPSEC_V=$(next_free_patch "clover-for-security-teams-v" "$APPSEC_V")
            jq --arg v "$APPSEC_V" '.version = $v' clover-for-security-teams/.claude-plugin/plugin.json > tmp.json && mv tmp.json clover-for-security-teams/.claude-plugin/plugin.json
            jq --arg v "$APPSEC_V" '(.plugins[] | select(.name == "clover-for-security-teams") | .version) = $v' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
            git add clover-for-security-teams/.claude-plugin/plugin.json .claude-plugin/marketplace.json
            git commit -m "chore(clover-for-security-teams): bump version to $APPSEC_V [skip ci]"
            BUMPED=true
            APPSEC_RELEASE=true
          else
            echo "clover-for-security-teams: no content changes since clover-for-security-teams-v$APPSEC_V — skipping."
          fi
          APPSEC_TAG="clover-for-security-teams-v$APPSEC_V"

          # ---- clover-for-developers -----------------------------------------
          DEV_PATHS=(clover-for-developers)
          DEV_V=$(jq -r '.version' clover-for-developers/.claude-plugin/plugin.json)
          DEV_RELEASE=false
          if ! tag_exists "clover-for-developers-v$DEV_V"; then
            DEV_RELEASE=true
          elif changed_since "clover-for-developers-v$DEV_V" "${DEV_PATHS[@]}"; then
            DEV_V=$(next_free_patch "clover-for-developers-v" "$DEV_V")
            jq --arg v "$DEV_V" '.version = $v' clover-for-developers/.claude-plugin/plugin.json > tmp.json && mv tmp.json clover-for-developers/.claude-plugin/plugin.json
            jq --arg v "$DEV_V" '(.plugins[] | select(.name == "clover-for-developers") | .version) = $v' .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
            git add clover-for-developers/.claude-plugin/plugin.json .claude-plugin/marketplace.json
            git commit -m "chore(clover-for-developers): bump version to $DEV_V [skip ci]"
            BUMPED=true
            DEV_RELEASE=true
          else
            echo "clover-for-developers: no content changes since clover-for-developers-v$DEV_V — skipping."
          fi
          DEV_TAG="clover-for-developers-v$DEV_V"

          # Push all bump commits once.
          if [ "$BUMPED" = true ]; then
            git push
          fi

          # ---- tag + release only the plugins that changed -------------------
          # clover is the flagship, so its release is always pinned as the repo's
          # "Latest". That keeps .../releases/latest (and
          # .../releases/latest/download/clover-plugin.zip) resolving to the clover
          # offline bundle no matter when a secondary plugin last released.
          if [ "$CLOVER_RELEASE" = true ] && ! tag_exists "$CLOVER_TAG"; then
            # Build the self-contained offline (air-gapped) bundle first, so a
            # build failure aborts before we create + push the tag.
            bash claude/scripts/build-org-zip.sh
            # Version-less copy so docs can link a permanent download URL.
            cp dist/clover-plugin-v*.zip dist/clover-plugin.zip
            git tag "$CLOVER_TAG"
            git push origin "$CLOVER_TAG"
            gh release create "$CLOVER_TAG" --title "$CLOVER_TAG" --latest --generate-notes \
              binaries/clover-hook-* dist/clover-plugin-v*.zip dist/clover-plugin.zip
          fi

          # Secondary plugin: never steal the "Latest" flag from clover.
          if [ "$APPSEC_RELEASE" = true ] && ! tag_exists "$APPSEC_TAG"; then
            git tag "$APPSEC_TAG"
            git push origin "$APPSEC_TAG"
            gh release create "$APPSEC_TAG" --title "$APPSEC_TAG" --latest=false --generate-notes
          fi

          if [ "$DEV_RELEASE" = true ] && ! tag_exists "$DEV_TAG"; then
            git tag "$DEV_TAG"
            git push origin "$DEV_TAG"
            gh release create "$DEV_TAG" --title "$DEV_TAG" --latest=false --generate-notes
          fi
