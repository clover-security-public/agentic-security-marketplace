name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests
        run: |
          for manifest in .claude-plugin/plugin.json .cursor-plugin/plugin.json \
                          clover-for-security-teams/.claude-plugin/plugin.json \
                          clover-for-security-teams-cursor/.cursor-plugin/plugin.json \
                          clover-for-developers/.claude-plugin/plugin.json \
                          clover-for-developers-cursor/.cursor-plugin/plugin.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            NAME=$(jq -r '.name' "$manifest")
            VERSION=$(jq -r '.version' "$manifest")
            echo "Plugin: $NAME v$VERSION"
            [ -n "$NAME" ] && [ -n "$VERSION" ] && echo "Valid" || exit 1
          done

      - name: Validate marketplace manifests
        run: |
          for manifest in .claude-plugin/marketplace.json .cursor-plugin/marketplace.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            echo "Valid"
          done

      - name: Check versions are in sync across all agent IDEs
        run: |
          CLAUDE_PLUGIN=$(jq -r '.version' .claude-plugin/plugin.json)
          CLAUDE_MARKET=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          CURSOR_PLUGIN=$(jq -r '.version' .cursor-plugin/plugin.json)
          CURSOR_MARKET=$(jq -r '.metadata.version' .cursor-plugin/marketplace.json)
          echo "claude/plugin=$CLAUDE_PLUGIN claude/marketplace=$CLAUDE_MARKET cursor/plugin=$CURSOR_PLUGIN cursor/marketplace=$CURSOR_MARKET"
          if [ "$CLAUDE_PLUGIN" = "$CLAUDE_MARKET" ] && [ "$CLAUDE_PLUGIN" = "$CURSOR_PLUGIN" ] && [ "$CLAUDE_PLUGIN" = "$CURSOR_MARKET" ]; then
            echo "Versions in sync: $CLAUDE_PLUGIN"
          else
            echo "ERROR: plugin/marketplace versions are out of sync — all four manifests must match" >&2
            exit 1
          fi

      # clover-for-security-teams and clover-for-developers are each versioned
      # independently of clover, but each one's four version locations — its
      # Claude and Cursor manifests plus its entry in both marketplaces — must
      # agree.
      - name: Check secondary plugin versions are in sync
        run: |
          for plugin in clover-for-security-teams clover-for-developers; do
            CLAUDE_PLUGIN=$(jq -r '.version' "$plugin/.claude-plugin/plugin.json")
            CURSOR_PLUGIN=$(jq -r '.version' "$plugin-cursor/.cursor-plugin/plugin.json")
            CLAUDE_MARKET=$(jq -r --arg name "$plugin" '.plugins[] | select(.name == $name) | .version' .claude-plugin/marketplace.json)
            CURSOR_MARKET=$(jq -r --arg name "$plugin-cursor" '.plugins[] | select(.name == $name) | .version' .cursor-plugin/marketplace.json)
            echo "$plugin: claude/plugin=$CLAUDE_PLUGIN cursor/plugin=$CURSOR_PLUGIN claude/marketplace=$CLAUDE_MARKET cursor/marketplace=$CURSOR_MARKET"
            if [ -n "$CLAUDE_PLUGIN" ] \
              && [ "$CLAUDE_PLUGIN" = "$CURSOR_PLUGIN" ] \
              && [ "$CLAUDE_PLUGIN" = "$CLAUDE_MARKET" ] \
              && [ "$CLAUDE_PLUGIN" = "$CURSOR_MARKET" ]; then
              echo "$plugin versions in sync: $CLAUDE_PLUGIN"
            else
              echo "ERROR: $plugin version is out of sync — its Claude/Cursor manifests and both marketplace entries must match" >&2
              exit 1
            fi
          done

      # Cursor cannot share a plugin directory with Claude. Cursor auto-detects
      # a plugin-root .mcp.json and it BEATS every alternative (verified on
      # Cursor 3.13.25: .mcp.json won over mcp.json, and mcp.json won over an
      # inline mcpServers block). Since Claude's .mcp.json must stay exactly as
      # it is, Cursor gets its own directory, "<plugin>-cursor", holding only a
      # .cursor-plugin manifest, its own .mcp.json, and a copy of the skills.
      #
      # Cursor also does NOT apply a "variables" default and lowercases ${VAR}
      # names before lookup, so the Cursor URL is concrete, not interpolated.
      # Self-hosted users override it in their own ~/.cursor/mcp.json.
      - name: Check Cursor plugin directories
        run: |
          for plugin in clover-for-security-teams clover-for-developers; do
            CURSOR_DIR="$plugin-cursor"

            # The Cursor plugin name carries a "-cursor" suffix on purpose.
            # Cursor auto-loads Claude plugins from ~/.claude/plugins, and two
            # plugins sharing a name collide with the Claude-sourced copy
            # winning — which would make this plugin silently unreachable for
            # anyone who also uses Claude Code. Verified on Cursor 3.13.25.
            if [ "$(jq -r '.name' "$CURSOR_DIR/.cursor-plugin/plugin.json")" != "$plugin-cursor" ]; then
              echo "ERROR: $CURSOR_DIR must be named '$plugin-cursor' so it cannot be shadowed by the Claude-installed plugin of the same name" >&2
              exit 1
            fi

            # A Cursor plugin root must not carry any Claude plugin files, or
            # Cursor would read Claude's ${user_config.*} placeholder and fail.
            for forbidden in .claude-plugin claude.mcp.json mcp.json; do
              if [ -e "$CURSOR_DIR/$forbidden" ]; then
                echo "ERROR: $CURSOR_DIR/$forbidden must not exist — Cursor must resolve its own .mcp.json" >&2
                exit 1
              fi
            done

            CLAUDE_URL=$(jq -r --arg name "$plugin" '.mcpServers[$name].url' "$plugin/.mcp.json")
            CURSOR_URL=$(jq -r --arg name "$plugin" '.mcpServers[$name].url' "$CURSOR_DIR/.mcp.json")
            echo "$plugin: claude=$CLAUDE_URL cursor=$CURSOR_URL"

            # The Cursor URL must be concrete: no unresolvable placeholder.
            case "$CURSOR_URL" in
              https://*) ;;
              *) echo "ERROR: $CURSOR_DIR/.mcp.json url must be an absolute https URL, not a placeholder (Cursor does not interpolate plugin variables)" >&2; exit 1 ;;
            esac

            # Both IDEs must target the same endpoint path.
            if [ "${CLAUDE_URL#*\}}" != "${CURSOR_URL#https://*.io}" ]; then
              echo "ERROR: $plugin MCP endpoint path differs between $plugin/.mcp.json and $CURSOR_DIR/.mcp.json" >&2
              exit 1
            fi

            # Skills are duplicated, so they must not drift.
            if ! diff -r "$plugin/skills" "$CURSOR_DIR/skills" > /dev/null; then
              echo "ERROR: $CURSOR_DIR/skills differs from $plugin/skills — keep the copies byte-identical" >&2
              diff -r "$plugin/skills" "$CURSOR_DIR/skills" || true
              exit 1
            fi
            echo "$plugin OK: cursor dir clean, url concrete, skills identical"
          done

      - name: Validate hooks manifests
        run: |
          for manifest in claude/hooks/hooks.json cursor/hooks/hooks.json clover-for-security-teams/hooks/hooks.json clover-for-developers/hooks/hooks.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            echo "Valid"
          done

      - name: Check scripts are executable
        run: |
          for f in claude/scripts/*.sh cursor/scripts/*.sh clover-for-security-teams/scripts/*.sh clover-for-developers/scripts/*.sh tests/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Test Windows runtime support
        run: bash tests/windows-support.sh

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck > /dev/null 2>&1
          shellcheck claude/scripts/*.sh cursor/scripts/*.sh clover-for-security-teams/scripts/*.sh clover-for-developers/scripts/*.sh tests/*.sh || true
