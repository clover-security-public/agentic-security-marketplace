name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests
        run: |
          for manifest in .claude-plugin/plugin.json .cursor-plugin/plugin.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            NAME=$(jq -r '.name' "$manifest")
            VERSION=$(jq -r '.version' "$manifest")
            echo "Plugin: $NAME v$VERSION"
            [ -n "$NAME" ] && [ -n "$VERSION" ] && echo "Valid" || exit 1
          done

      - name: Validate marketplace manifests
        run: |
          for manifest in .claude-plugin/marketplace.json .cursor-plugin/marketplace.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            echo "Valid"
          done

      - name: Check versions are in sync across all agent IDEs
        run: |
          CLAUDE_PLUGIN=$(jq -r '.version' .claude-plugin/plugin.json)
          CLAUDE_MARKET=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          CURSOR_PLUGIN=$(jq -r '.version' .cursor-plugin/plugin.json)
          CURSOR_MARKET=$(jq -r '.metadata.version' .cursor-plugin/marketplace.json)
          echo "claude/plugin=$CLAUDE_PLUGIN claude/marketplace=$CLAUDE_MARKET cursor/plugin=$CURSOR_PLUGIN cursor/marketplace=$CURSOR_MARKET"
          if [ "$CLAUDE_PLUGIN" = "$CLAUDE_MARKET" ] && [ "$CLAUDE_PLUGIN" = "$CURSOR_PLUGIN" ] && [ "$CLAUDE_PLUGIN" = "$CURSOR_MARKET" ]; then
            echo "Versions in sync: $CLAUDE_PLUGIN"
          else
            echo "ERROR: plugin/marketplace versions are out of sync — all four manifests must match" >&2
            exit 1
          fi

      # clover-for-security-teams is versioned independently of clover, but its
      # own two version locations (its manifest + the marketplace entry) must
      # agree.
      - name: Check clover-for-security-teams version is in sync
        run: |
          APPSEC_PLUGIN=$(jq -r '.version' clover-for-security-teams/.claude-plugin/plugin.json)
          APPSEC_MARKET=$(jq -r '.plugins[] | select(.name == "clover-for-security-teams") | .version' .claude-plugin/marketplace.json)
          echo "clover-for-security-teams/plugin=$APPSEC_PLUGIN marketplace=$APPSEC_MARKET"
          if [ -n "$APPSEC_PLUGIN" ] && [ "$APPSEC_PLUGIN" = "$APPSEC_MARKET" ]; then
            echo "clover-for-security-teams versions in sync: $APPSEC_PLUGIN"
          else
            echo "ERROR: clover-for-security-teams version is out of sync between its manifest and the marketplace entry" >&2
            exit 1
          fi

      # clover-for-developers is versioned independently of clover, but its own
      # two version locations (its manifest + the marketplace entry) must agree.
      - name: Check clover-for-developers version is in sync
        run: |
          DEV_PLUGIN=$(jq -r '.version' clover-for-developers/.claude-plugin/plugin.json)
          DEV_MARKET=$(jq -r '.plugins[] | select(.name == "clover-for-developers") | .version' .claude-plugin/marketplace.json)
          echo "clover-for-developers/plugin=$DEV_PLUGIN marketplace=$DEV_MARKET"
          if [ -n "$DEV_PLUGIN" ] && [ "$DEV_PLUGIN" = "$DEV_MARKET" ]; then
            echo "clover-for-developers versions in sync: $DEV_PLUGIN"
          else
            echo "ERROR: clover-for-developers version is out of sync between its manifest and the marketplace entry" >&2
            exit 1
          fi

      - name: Validate hooks manifests
        run: |
          for manifest in claude/hooks/hooks.json cursor/hooks/hooks.json clover-for-security-teams/hooks/hooks.json clover-for-developers/hooks/hooks.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            echo "Valid"
          done

      # cursor/scripts holds no .sh any more: its launcher is deliberately
      # extensionless so one hooks.json command reaches the POSIX half here and
      # clover-hook.cmd on Windows. The .cmd needs no exec bit on Linux.
      - name: Check scripts are executable
        run: |
          for f in claude/scripts/*.sh cursor/scripts/clover-hook clover-for-security-teams/scripts/*.sh clover-for-developers/scripts/*.sh tests/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Test Windows runtime support
        run: bash tests/windows-support.sh

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck > /dev/null 2>&1
          shellcheck claude/scripts/*.sh cursor/scripts/clover-hook clover-for-security-teams/scripts/*.sh clover-for-developers/scripts/*.sh tests/*.sh || true
