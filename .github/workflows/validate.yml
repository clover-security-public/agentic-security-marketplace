name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests
        run: |
          for manifest in .claude-plugin/plugin.json .cursor-plugin/plugin.json \
                          clover-for-security-teams/.claude-plugin/plugin.json \
                          clover-for-security-teams/.cursor-plugin/plugin.json \
                          clover-for-developers/.claude-plugin/plugin.json \
                          clover-for-developers/.cursor-plugin/plugin.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            NAME=$(jq -r '.name' "$manifest")
            VERSION=$(jq -r '.version' "$manifest")
            echo "Plugin: $NAME v$VERSION"
            [ -n "$NAME" ] && [ -n "$VERSION" ] && echo "Valid" || exit 1
          done

      - name: Validate marketplace manifests
        run: |
          for manifest in .claude-plugin/marketplace.json .cursor-plugin/marketplace.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            echo "Valid"
          done

      - name: Check versions are in sync across all agent IDEs
        run: |
          CLAUDE_PLUGIN=$(jq -r '.version' .claude-plugin/plugin.json)
          CLAUDE_MARKET=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          CURSOR_PLUGIN=$(jq -r '.version' .cursor-plugin/plugin.json)
          CURSOR_MARKET=$(jq -r '.metadata.version' .cursor-plugin/marketplace.json)
          echo "claude/plugin=$CLAUDE_PLUGIN claude/marketplace=$CLAUDE_MARKET cursor/plugin=$CURSOR_PLUGIN cursor/marketplace=$CURSOR_MARKET"
          if [ "$CLAUDE_PLUGIN" = "$CLAUDE_MARKET" ] && [ "$CLAUDE_PLUGIN" = "$CURSOR_PLUGIN" ] && [ "$CLAUDE_PLUGIN" = "$CURSOR_MARKET" ]; then
            echo "Versions in sync: $CLAUDE_PLUGIN"
          else
            echo "ERROR: plugin/marketplace versions are out of sync — all four manifests must match" >&2
            exit 1
          fi

      # clover-for-security-teams and clover-for-developers are each versioned
      # independently of clover, but each one's four version locations — its
      # Claude and Cursor manifests plus its entry in both marketplaces — must
      # agree.
      - name: Check secondary plugin versions are in sync
        run: |
          for plugin in clover-for-security-teams clover-for-developers; do
            CLAUDE_PLUGIN=$(jq -r '.version' "$plugin/.claude-plugin/plugin.json")
            CURSOR_PLUGIN=$(jq -r '.version' "$plugin/.cursor-plugin/plugin.json")
            CLAUDE_MARKET=$(jq -r --arg name "$plugin" '.plugins[] | select(.name == $name) | .version' .claude-plugin/marketplace.json)
            CURSOR_MARKET=$(jq -r --arg name "$plugin" '.plugins[] | select(.name == $name) | .version' .cursor-plugin/marketplace.json)
            echo "$plugin: claude/plugin=$CLAUDE_PLUGIN cursor/plugin=$CURSOR_PLUGIN claude/marketplace=$CLAUDE_MARKET cursor/marketplace=$CURSOR_MARKET"
            if [ -n "$CLAUDE_PLUGIN" ] \
              && [ "$CLAUDE_PLUGIN" = "$CURSOR_PLUGIN" ] \
              && [ "$CLAUDE_PLUGIN" = "$CLAUDE_MARKET" ] \
              && [ "$CLAUDE_PLUGIN" = "$CURSOR_MARKET" ]; then
              echo "$plugin versions in sync: $CLAUDE_PLUGIN"
            else
              echo "ERROR: $plugin version is out of sync — its Claude/Cursor manifests and both marketplace entries must match" >&2
              exit 1
            fi
          done

      # Every MCP-bearing plugin must expose the same server on both IDEs: the
      # Claude side reads .mcp.json (${user_config.*} placeholders), the Cursor
      # side reads mcpServers in .cursor-plugin/plugin.json (${VAR} placeholders
      # declared under "variables"). The syntaxes are not interchangeable, so
      # the two are separate files — this check keeps their endpoints identical.
      - name: Check MCP server endpoints match across agent IDEs
        run: |
          for plugin in clover-for-security-teams clover-for-developers; do
            CLAUDE_URL=$(jq -r --arg name "$plugin" '.mcpServers[$name].url' "$plugin/.mcp.json")
            CURSOR_URL=$(jq -r --arg name "$plugin" '.mcpServers[$name].url' "$plugin/.cursor-plugin/plugin.json")
            CLAUDE_PATH=${CLAUDE_URL#*\}}
            CURSOR_PATH=${CURSOR_URL#*\}}
            echo "$plugin: claude=$CLAUDE_URL cursor=$CURSOR_URL"
            if [ -n "$CLAUDE_PATH" ] && [ "$CLAUDE_PATH" = "$CURSOR_PATH" ]; then
              echo "$plugin MCP endpoint in sync: $CLAUDE_PATH"
            else
              echo "ERROR: $plugin MCP endpoint differs between .mcp.json and .cursor-plugin/plugin.json" >&2
              exit 1
            fi
            # The Cursor URL must interpolate a variable the manifest declares.
            CURSOR_VAR=$(printf '%s' "$CURSOR_URL" | sed -n 's/^\${\([A-Za-z0-9_]*\)}.*/\1/p')
            if [ -z "$CURSOR_VAR" ] || [ "$(jq -r --arg v "$CURSOR_VAR" '.variables.properties | has($v)' "$plugin/.cursor-plugin/plugin.json")" != "true" ]; then
              echo "ERROR: $plugin Cursor MCP url must start with a \${VAR} declared in .variables.properties" >&2
              exit 1
            fi
            echo "$plugin Cursor variable declared: $CURSOR_VAR"
          done

      - name: Validate hooks manifests
        run: |
          for manifest in claude/hooks/hooks.json cursor/hooks/hooks.json clover-for-security-teams/hooks/hooks.json clover-for-developers/hooks/hooks.json; do
            echo "Checking $manifest..."
            jq empty "$manifest"
            echo "Valid"
          done

      - name: Check scripts are executable
        run: |
          for f in claude/scripts/*.sh cursor/scripts/*.sh clover-for-security-teams/scripts/*.sh clover-for-developers/scripts/*.sh tests/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Test Windows runtime support
        run: bash tests/windows-support.sh

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck > /dev/null 2>&1
          shellcheck claude/scripts/*.sh cursor/scripts/*.sh clover-for-security-teams/scripts/*.sh clover-for-developers/scripts/*.sh tests/*.sh || true
